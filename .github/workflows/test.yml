name: Cross-platform install and runtime
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
        include:
          - os: ubuntu-latest
            node: '18'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # OS provisioning happens only on disposable CI runners, never in the CLI.
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Chocolatey's command shims are in the runner's existing PATH.
          ffmpeg -version
          ffprobe -version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Real native tests, isolated npm prefix/cache and pinned Git source
        run: npm test
        env:
          DEMO_GIT_SOURCE: git+https://github.com/${{ github.repository }}.git#${{ github.sha }}
          DEMO_GITHUB_TOKEN: ${{ github.token }}
